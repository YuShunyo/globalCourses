<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界时钟 · World Clock</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23F0EEE6' stroke='%232B2B28' stroke-width='4'/%3E%3Cline x1='32' y1='32' x2='32' y2='14' stroke='%232B2B28' stroke-width='4.5' stroke-linecap='round'/%3E%3Cline x1='32' y1='32' x2='45' y2='39' stroke='%232B2B28' stroke-width='4.5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%232B2B28'/%3E%3C/svg%3E">
<style>
  :root{
    --bg-page:#F0EEE6;
    --text-primary:#2B2B28;

    /* 卡片 / 表盘的文字色（浅色背景时用深色字；深色背景用白字，由 JS 按天色选择） */
    --day-text:#3A3833;
    --day-border: rgba(43,43,40,0.14);
    /* 天色渐变：由 JS 按太阳高度实时写入（这里只是加载前的默认值） */
    --sky-top:#FFFFFF; --sky-bottom:#FFFFFF;

    --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', 'Liberation Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html, body{ height:100%; }

  body{
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: var(--sans);
    padding: 3vh 3vw;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .page{ width:100%; max-width:1400px; }

  header{
    text-align:center;
    margin-bottom: 3vh;
  }

  h1{
    font-size: clamp(20px, 2.6vw, 32px);
    font-weight:700;
    letter-spacing:0.02em;
    color: var(--text-primary);
  }

  .grid{
    display:flex;
    flex-wrap: nowrap;
    gap: 1.2vw;
    width:100%;
  }

  .card{
    flex: 1 1 0;
    min-width:0;
    aspect-ratio: 1 / 1;
    container-type: inline-size;
    border-radius: 6%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background-color: var(--card-bg);
    background-image: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
    color: var(--card-text);
    text-shadow: var(--text-shadow, none);
    border: 1px solid var(--card-border, transparent);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    transition: background .6s ease, color .6s ease, order .3s ease, transform .25s ease, box-shadow .25s ease;
    overflow:hidden;
    padding: 2% 1.5%;
    cursor: pointer;
    outline: 0 solid transparent;
    outline-offset: 3px;
    -webkit-tap-highlight-color: transparent;
  }

  /* 选中的城市卡片：淡淡的橙色光晕，与表盘外圈的橙色光晕呼应 */
  .card.selected{
    box-shadow:
      0 0 0 1.5px rgba(255,159,10,0.55),
      0 0 26px 4px rgba(255,159,10,0.42),
      0 8px 24px rgba(0,0,0,0.12);
  }
  .card:focus{ outline: none; }
  .card:focus-visible{ box-shadow: 0 0 0 2px rgba(255,159,10,0.6), 0 8px 24px rgba(0,0,0,0.12); }

  .city-name-wrap{
    position: relative;
    display: inline-block;
    margin-bottom: 4cqw;
  }

  .city-name{
    font-size: 19cqw;
    font-weight:800;
    letter-spacing:0.03em;
    white-space:nowrap;
    cursor:pointer;
    border-radius: 10px;
    padding: 1cqw 2cqw;
    transition: background .2s ease;
    -webkit-tap-highlight-color: transparent;
  }

  @media (hover: hover) and (pointer: fine){
    .city-name-wrap:hover .city-name{
      background: color-mix(in srgb, currentColor 10%, transparent);
    }
  }

  /* 透明覆盖层 select：盖住整块可见文字，点哪里都能唤起原生选择器，
     但可见的城市名文字完全自定义，不受 select 自带外观限制 */
  .city-select-overlay{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }

  .time-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:0;
    font-family: var(--mono);
    font-weight:700;
    line-height:1;
    margin-bottom: 4cqw;
    white-space:nowrap;
  }

  .time-part{
    font-size: 19cqw;
    font-variant-numeric: tabular-nums;
  }

  .colon{ padding: 0 0.3cqw; }

  .date-display{
    position: relative;
    font-family: var(--mono);
    font-size: 9cqw;
    letter-spacing:0.04em;
    opacity:0.8;
    white-space:nowrap;
  }
  /* 透明的原生日期选择框，盖在日期文字上：点击范围只比文字大一点点（上方 4px，下方 0，左右各 4px），避免选卡片时误触 */
  .date-input{
    position:absolute;
    left:-4px; right:-4px; top:-4px; bottom:0;
    width:calc(100% + 8px); height:calc(100% + 4px);
    opacity:0; border:none; padding:0; margin:0;
    font-size:16px; /* 避免 iOS 聚焦时自动放大页面 */
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  @media (hover:hover){
    .date-display:hover [data-role="datetext"]{ text-decoration: underline dotted; text-underline-offset: 0.2em; }
  }

  /* 与选中城市的时差（选中的卡片不显示，只保留占位高度） */
  .diff-display{
    font-family: var(--mono);
    font-size: 8.5cqw;
    letter-spacing:0.04em;
    opacity:0.6;
    white-space:nowrap;
    line-height:1.3;
    height:1.3em;
    margin-top:-0.4cqw;
  }

  /* ===== 手动拨转的圆形表盘 ===== */
  .analog-section{
    margin-top: 4vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 0.8vh;
  }

  .analog-face-wrap{
    width: min(45.6vw, 384px);
    min-width: 240px;
    aspect-ratio: 1 / 1;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action: none;
    border-radius: 50%;
    box-shadow: 0 0 0 1.5px rgba(255,159,10,0.55), 0 0 26px 4px rgba(255,159,10,0.42); /* 与选中卡片同款：细橙边 + 光晕 */
    cursor: grab;
    user-select: none;
  }

  .analog-face-wrap:active{ cursor: grabbing; }

  .analog-face{
    width:100%; height:100%; display:block;
    color: var(--card-text, var(--day-text));
    filter: drop-shadow(0 10px 26px rgba(0,0,0,0.14));
    transition: color .6s ease;
  }

  .sky-stop-top{ stop-color: var(--sky-top); }
  .sky-stop-bottom{ stop-color: var(--sky-bottom); }

  .face-bg{
    fill: url(#skyGrad);
    stroke: none;
    transition: fill .6s ease;
  }

  .tick{ stroke:currentColor; stroke-width:1.6; opacity:0.45; }
  .tick.major{ stroke-width:2.6; opacity:0.85; }

  .hour-number{
    font-family: var(--sans);
    font-weight:700;
    font-size: 15px;
    fill: currentColor;
    opacity:0.85;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .hand{ stroke:currentColor; stroke-linecap:round; pointer-events:none; }
  .hour-hand{ stroke-width:5.5; }
  .minute-hand{ stroke-width:3; }
  /* 声音关闭：秒针与时针同色；声音开启（svg 带 .sound-on）：秒针为橙色 */
  .second-hand{ stroke:currentColor; stroke-width:1.4; stroke-linecap:round; pointer-events:none; transition: stroke .2s ease; }
  .second-hand-tail{ stroke:currentColor; stroke-width:1.4; stroke-linecap:round; pointer-events:none; transition: stroke .2s ease; }
  .center-dot{ fill:currentColor; pointer-events:none; }
  .center-dot-second{ fill:currentColor; pointer-events:none; transition: fill .2s ease; }
  .analog-face.sound-on .second-hand,
  .analog-face.sound-on .second-hand-tail{ stroke:#FF9F0A; }
  .analog-face.sound-on .center-dot-second{ fill:#FF9F0A; }
  /* 圆心的点击热区（透明，比可见圆点大，方便手指点） */
  .hub-hit{ fill:transparent; pointer-events:all; cursor:pointer; outline:none; -webkit-tap-highlight-color: transparent; }
  .hub-hit:focus-visible{ stroke:#FF9F0A; stroke-width:1.5; }
  @media (prefers-reduced-motion: reduce){
    .second-hand, .second-hand-tail, .center-dot-second{ transition:none; }
  }

  /* ===== 时间被拨动后的视觉状态（body.time-shifted）===== */
  /* 拨动后：未选中的卡片亮起蓝色光晕（强度与选中卡片的橙色光晕相同）；选中卡片保持原来的橙色光晕不变 */
  body.time-shifted .card:not(.selected){
    box-shadow:
      0 0 0 1.5px rgba(46,155,214,0.55),
      0 0 26px 4px rgba(46,155,214,0.42),
      0 8px 24px rgba(0,0,0,0.12);
  }
  /* 偏移状态：真实时间的“影子指针”（淡灰、与真实指针同粗，画在真实指针下面） */
  .ghost-hands{ opacity:0; transition: opacity .35s ease; pointer-events:none; }
  body.time-shifted .ghost-hands{ opacity:1; }
  /* 淡灰色，粗细与真实指针一致（画在真实指针下面） */
  .ghost-hands line{ stroke: #A9A8A1; stroke-linecap: round; opacity:.22; }
  .ghost-hour{ stroke-width:5.5; }
  .ghost-minute{ stroke-width:3; }
</style>
</head>
<body>

<div class="page">
  <header>
    <h1>世界时钟</h1>
  </header>

  <div class="grid" id="clockGrid"></div>

  <div class="analog-section" id="analogSection">
    <div class="analog-face-wrap" id="analogFaceWrap">
      <svg class="analog-face" viewBox="2 2 196 196" id="analogSvg">
        <defs><linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="sky-stop-top"/><stop offset="1" class="sky-stop-bottom"/></linearGradient></defs>
        <circle class="face-bg" cx="100" cy="100" r="98"/>
        <g id="dialTicks"></g>
        <g id="dialNumbers"></g>
        <g class="ghost-hands" id="ghostHands">
          <line class="ghost-minute" id="ghostMinute" x1="100" y1="100" x2="100" y2="28"/>
          <line class="ghost-hour" id="ghostHour" x1="100" y1="100" x2="100" y2="50"/>
        </g>
        <line class="hand minute-hand" id="minuteHand" x1="100" y1="100" x2="100" y2="28"/>
        <line class="hand hour-hand" id="hourHand" x1="100" y1="100" x2="100" y2="50"/>
        <g id="secondHand">
          <line class="second-hand-tail" x1="100" y1="100" x2="100" y2="118"/>
          <line class="second-hand" x1="100" y1="100" x2="100" y2="22"/>
        </g>
        <circle class="center-dot" cx="100" cy="100" r="4"/>
        <circle class="center-dot-second" cx="100" cy="100" r="2"/>
        <circle class="hub-hit" id="hubToggle" cx="100" cy="100" r="15" role="button" tabindex="0" aria-pressed="false" aria-label="秒针声音（点击开关）"/>
      </svg>
    </div>
  </div>
</div>

<script>
  const cityOptions = [
    { city:'纽约', tz:'America/New_York', flag:'🇺🇸', lat:40.71, lon:-74.01 },
    { city:'洛杉矶', tz:'America/Los_Angeles', flag:'🇺🇸', lat:34.05, lon:-118.24 },
    { city:'芝加哥', tz:'America/Chicago', flag:'🇺🇸', lat:41.88, lon:-87.63 },
    { city:'多伦多', tz:'America/Toronto', flag:'🇨🇦', lat:43.65, lon:-79.38 },
    { city:'墨西哥城', tz:'America/Mexico_City', flag:'🇲🇽', lat:19.43, lon:-99.13 },
    { city:'圣保罗', tz:'America/Sao_Paulo', flag:'🇧🇷', lat:-23.55, lon:-46.63 },
    { city:'伦敦', tz:'Europe/London', flag:'🇬🇧', lat:51.51, lon:-0.13 },
    { city:'巴黎', tz:'Europe/Paris', flag:'🇫🇷', lat:48.86, lon:2.35 },
    { city:'柏林', tz:'Europe/Berlin', flag:'🇩🇪', lat:52.52, lon:13.41 },
    { city:'莫斯科', tz:'Europe/Moscow', flag:'🇷🇺', lat:55.76, lon:37.62 },
    { city:'迪拜', tz:'Asia/Dubai', flag:'🇦🇪', lat:25.2, lon:55.27 },
    { city:'新德里', tz:'Asia/Kolkata', flag:'🇮🇳', lat:28.61, lon:77.21 },
    { city:'曼谷', tz:'Asia/Bangkok', flag:'🇹🇭', lat:13.75, lon:100.5 },
    { city:'新加坡', tz:'Asia/Singapore', flag:'🇸🇬', lat:1.35, lon:103.82 },
    { city:'香港', tz:'Asia/Hong_Kong', flag:'🇭🇰', lat:22.32, lon:114.17 },
    { city:'上海', tz:'Asia/Shanghai', flag:'🇨🇳', lat:31.23, lon:121.47 },
    { city:'北京', tz:'Asia/Shanghai', flag:'🇨🇳', lat:39.9, lon:116.41 },
    { city:'东京', tz:'Asia/Tokyo', flag:'🇯🇵', lat:35.68, lon:139.69 },
    { city:'首尔', tz:'Asia/Seoul', flag:'🇰🇷', lat:37.57, lon:126.98 },
    { city:'悉尼', tz:'Australia/Sydney', flag:'🇦🇺', lat:-33.87, lon:151.21 },
    { city:'奥克兰', tz:'Pacific/Auckland', flag:'🇳🇿', lat:-36.85, lon:174.76 },
  ];

  let cities = [
    { city:'纽约', tz:'America/New_York' },
    { city:'伦敦', tz:'Europe/London'    },
    { city:'北京', tz:'Asia/Shanghai'    },
    { city:'东京', tz:'Asia/Tokyo'       },
  ];

  const grid = document.getElementById('clockGrid');

  // ===== 手动表盘状态 =====
  // 表盘显示“被选中的城市卡片”的时间；默认选中与本机时区一致的卡片，没有则选第一张
  const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  let selectedIndex = Math.max(0, cities.findIndex(c => c.tz === localTz));
  let dialTz = cities[selectedIndex].tz;

  function setSelected(i){
    selectedIndex = i;
    dialTz = cities[i].tz;
    grid.querySelectorAll('.card').forEach((card, idx) => {
      const on = idx === i;
      card.classList.toggle('selected', on);
      card.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    update();
    updateDialFace();
  }
  let timeOffsetMs = 0; // 拖动表盘产生的全局时间偏移，会同时应用到上方4个时钟

  function getSimulatedNow(){
    return new Date(Date.now() + timeOffsetMs);
  }

  function buildOptionsHtml(selectedCity, selectedTz){
    const now = new Date();
    // 按 UTC 偏移从小到大排序（时间最早的在最上面，最晚的在最下面）
    const sortedOptions = [...cityOptions].sort(
      (a, b) => getOffsetMinutes(a.tz, now) - getOffsetMinutes(b.tz, now)
    );
    return sortedOptions.map(opt => {
      const value = `${opt.city}|${opt.tz}`;
      const label = `${opt.flag} ${opt.city} ${formatOffset(Math.round(getOffsetMinutes(opt.tz, now)))}`;
      const isSelected = (opt.city === selectedCity && opt.tz === selectedTz) ? ' selected' : '';
      return `<option value="${value}"${isSelected}>${label}</option>`;
    }).join('');
  }

  function renderCards(){
    grid.innerHTML = '';
    cities.forEach((c, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.tz = c.tz;
      card.dataset.index = i;
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.setAttribute('aria-pressed', i === selectedIndex ? 'true' : 'false');
      if(i === selectedIndex) card.classList.add('selected');
      card.innerHTML = `
        <div class="city-name-wrap">
          <div class="city-name" data-role="cityname">${c.city}</div>
          <select class="city-select-overlay" data-role="cityselect">${buildOptionsHtml(c.city, c.tz)}</select>
        </div>
        <div class="time-row">
          <span class="time-part" data-role="hm">--:--</span><span class="colon time-part" data-role="colon2">:</span><span class="time-part" data-role="ss">--</span>
        </div>
        <div class="date-display" data-role="date"><span data-role="datetext">----/--/--</span><input type="date" class="date-input" min="1970-01-01" max="2100-12-31" aria-label="选择日期"></div>
        <div class="diff-display" data-role="diff"></div>
      `;
      const nameEl = card.querySelector('[data-role="cityname"]');
      const selectEl = card.querySelector('[data-role="cityselect"]');
      selectEl.addEventListener('change', (e) => {
        const [city, tz] = e.target.value.split('|');
        cities[i] = { city, tz };
        card.dataset.tz = tz;
        nameEl.textContent = city;
        if(i === selectedIndex) dialTz = tz; // 选中的卡片换了城市，表盘跟着换
        update();
        updateDialFace();
        e.target.blur();
      });
      // 点击卡片空白处选中；点城市名仍然是弹出下拉框换城市；点日期是弹出日期选择器
      card.addEventListener('click', (e) => {
        if(e.target.closest('.city-name-wrap, .date-display')) return;
        setSelected(i);
      });
      // 点日期：弹出原生日期选择器；选定后该城市保持当前钟点，其余城市跟着变
      const dateInput = card.querySelector('.date-input');
      dateInput.addEventListener('click', () => { try{ dateInput.showPicker(); }catch(_){} });
      dateInput.addEventListener('change', () => { if(dateInput.value) setCityDate(i, dateInput.value); dateInput.blur(); });
      card.addEventListener('keydown', (e) => {
        if(e.target !== card) return;
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); setSelected(i); }
      });
      grid.appendChild(card);
    });
  }

  // 把某时区的本地时间换算成 UTC 毫秒（做两遍，处理夏令时切换附近的偏差）
  function zonedToUtc(y, mo, d, h, mi, s, tz){
    const guess = Date.UTC(y, mo - 1, d, h, mi, s);
    const off = getOffsetMinutes(tz, new Date(guess));
    let utc = guess - off * 60000;
    const off2 = getOffsetMinutes(tz, new Date(utc));
    if(off2 !== off) utc = guess - off2 * 60000;
    return utc;
  }
  function setCityDate(i, ymd){
    const [y, mo, d] = ymd.split('-').map(Number);
    if(!y || y < 1970 || y > 2100) return;
    const tz = cities[i].tz, simNow = getSimulatedNow();
    const parts = {};
    getFmt('card', tz).formatToParts(simNow).forEach(p => parts[p.type] = p.value);
    const h = parts.hour === '24' ? 0 : parseInt(parts.hour, 10);
    const utc = zonedToUtc(y, mo, d, h, parseInt(parts.minute, 10), parseInt(parts.second, 10), tz) + (simNow.getTime() % 1000);
    cancelSweep();
    timeOffsetMs = utc - Date.now();
    update();
    updateDialFace();
    lastSoundSec = Math.floor(getSimulatedNow().getTime() / 1000);
    scheduleSecondLoop();
  }

  // ===== 扩大“选中卡片”的点击范围：卡片上方和下方各延伸一小段，点在这个范围内也能选中该卡片 =====
  // （卡片本身有 overflow:hidden，所以不用 CSS 伪元素，而是按点击位置判断落在哪张卡片的上下延伸带里）
  const HIT_EXTRA_TOP = 32, HIT_EXTRA_BOTTOM = 30; // px
  function cardIndexAtExtended(x, y){
    const list = grid.querySelectorAll('.card');
    for(let idx = 0; idx < list.length; idx++){
      const r = list[idx].getBoundingClientRect();
      if(x >= r.left && x <= r.right && y >= r.top - HIT_EXTRA_TOP && y <= r.bottom + HIT_EXTRA_BOTTOM) return idx;
    }
    return -1;
  }
  document.addEventListener('click', (e) => {
    if(e.target.closest('.card, #analogFaceWrap, select, input, button, a')) return; // 卡片 / 表盘自己的点击照旧
    const idx = cardIndexAtExtended(e.clientX, e.clientY);
    if(idx >= 0) setSelected(idx);
  });

  function formatOffset(minutes){
    const sign = minutes >= 0 ? '+' : '-';
    const abs = Math.abs(minutes);
    const h = Math.floor(abs / 60);
    const m = abs % 60;
    return `UTC${sign}${h}${m ? ':' + String(m).padStart(2, '0') : ''}`;
  }

  // 时差文字：+13h / -6h / +5h30m
  function formatDiff(minutes){
    const sign = minutes >= 0 ? '+' : '-';
    const abs = Math.abs(Math.round(minutes));
    const h = Math.floor(abs / 60), m = abs % 60;
    return `${sign}${h}h${m ? m + 'm' : ''}`;
  }

  function getOffsetMinutes(tz, date){
    const dtf = getFmt('off', tz);
    const parts = {};
    dtf.formatToParts(date).forEach(p => parts[p.type] = p.value);
    const asUTC = Date.UTC(
      parseInt(parts.year), parseInt(parts.month) - 1, parseInt(parts.day),
      parseInt(parts.hour), parseInt(parts.minute), parseInt(parts.second)
    );
    return (asUTC - date.getTime()) / 60000;
  }

  // ===== 时间格式化器缓存：每个时区每种格式只创建一次（Intl.DateTimeFormat 构造很重，原来每秒都在重复创建）=====
  const FMT_OPTS = {
    card: { hour12:false, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' },
    off:  { hourCycle:'h23', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' },
    dial: { hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit' }
  };
  const fmtCache = {};
  function getFmt(kind, tz){
    const k = kind + '|' + tz;
    return fmtCache[k] || (fmtCache[k] = new Intl.DateTimeFormat('en-US', Object.assign({ timeZone: tz }, FMT_OPTS[kind])));
  }

  // ===== 天色：按太阳真实高度算出卡片的“天顶色 / 地平线色” =====
  // 太阳高度角（简化天文公式，只用经纬度和 UTC 时间，不受夏令时、统一时区影响）
  function sunInfo(lat, lon, ms){
    const d = ms / 86400000 + 2440587.5 - 2451545.0, rad = Math.PI / 180;
    const L = (280.46 + 0.9856474 * d) % 360, g = ((357.528 + 0.9856003 * d) % 360) * rad;
    const lam = (L + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * rad, eps = 23.439 * rad;
    const dec = Math.asin(Math.sin(eps) * Math.sin(lam));
    const ra = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam));
    const ha = ((280.46061837 + 360.98564736629 * d + lon) * rad) - ra;
    const elev = Math.asin(Math.sin(lat * rad) * Math.sin(dec) + Math.cos(lat * rad) * Math.cos(dec) * Math.cos(ha)) / rad;
    return { elev, morning: Math.atan2(Math.sin(ha), Math.cos(ha)) < 0 };
  }
  // 天色渐变（Apple 天气路线）：每个时刻有“天顶色 / 地平线色”两个颜色，随太阳高度连续过渡。
  // 上午：深夜藏青 → 蓝调 → 日出（冷蓝到浅粉）→ 越来越饱和的晴空蓝
  // 下午：晴空蓝 → 金色时刻（蓝到金黄）→ 日落（靛蓝到橙）→ 晚霞（深紫到洋红）→ 夜晚
  const SKY_MORNING = [
    [-18, '#070D22', '#18224A'],
    [-10, '#16244F', '#3F5A9C'],
    [ -4, '#29408A', '#7A82BE'],
    [  0, '#3F66B0', '#F1B7A6'],
    [2.5, '#3F72C6', '#D2BFD8'],
    [  6, '#3A78D2', '#8EC0EF'],
    [ 20, '#3079D8', '#78B6F2'],
    [ 45, '#2A74D9', '#6BB0F2']
  ];
  const SKY_EVENING = [
    [-18, '#070D22', '#18224A'],
    [-12, '#10173F', '#4A3A7C'],
    [ -6, '#1F2860', '#C14E78'],
    [ -2, '#2A3482', '#DC5F66'],
    [  1, '#3B4A98', '#F28A4C'],
    [  6, '#4E68BE', '#F5A860'],
    [ 12, '#4B7FCB', '#F1C98E'],
    [ 20, '#3F7FD4', '#C4D8EE'],
    [ 30, '#3079D8', '#78B6F2'],
    [ 45, '#2A74D9', '#6BB0F2']
  ];
  function hexToRgb(h){ return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }
  function rgbToHex(c){ return '#' + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
  // 在 OKLab（感知均匀）空间里混色，避免在 RGB 里把蓝和金黄混成灰米色
  const toLin = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  const fromLin = v => 255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055);
  function rgbToLab(c){
    const r = toLin(c[0]), g = toLin(c[1]), b = toLin(c[2]);
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
            1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
            0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
  }
  function labToRgb(c){
    const l = Math.pow(c[0] + 0.3963377774 * c[1] + 0.2158037573 * c[2], 3);
    const m = Math.pow(c[0] - 0.1055613458 * c[1] - 0.0638541728 * c[2], 3);
    const s = Math.pow(c[0] - 0.0894841775 * c[1] - 1.2914855480 * c[2], 3);
    return [fromLin(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s),
            fromLin(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s),
            fromLin(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s)];
  }
  function mixLab(a, b, t){ const x = rgbToLab(a), y = rgbToLab(b); return labToRgb(x.map((v, i) => v + (y[i] - v) * t)); }
  function lum(c){ return 0.2126 * toLin(c[0]) + 0.7152 * toLin(c[1]) + 0.0722 * toLin(c[2]); }
  const SKY_PARSED = { m: SKY_MORNING, e: SKY_EVENING };
  for(const k in SKY_PARSED) SKY_PARSED[k] = SKY_PARSED[k].map(r => [r[0], hexToRgb(r[1]), hexToRgb(r[2])]);
  function skyColors(elev, morning){
    const S = SKY_PARSED[morning ? 'm' : 'e'];
    let top, bottom;
    if(elev <= S[0][0]){ top = S[0][1]; bottom = S[0][2]; }
    else if(elev >= S[S.length - 1][0]){ top = S[S.length - 1][1]; bottom = S[S.length - 1][2]; }
    else {
      let i = 1; while(elev > S[i][0]) i++;
      const t = (elev - S[i - 1][0]) / (S[i][0] - S[i - 1][0]);
      top = mixLab(S[i - 1][1], S[i][1], t); bottom = mixLab(S[i - 1][2], S[i][2], t);
    }
    // 文字：和 Apple 天气一样，尽量用白字（带一点投影）；只有背景很亮、白字读不清时才换深色字
    const L = lum(mixLab(top, bottom, 0.5));
    const white = (1.05) / (L + 0.05) >= 2.3;
    return { top: rgbToHex(top), bottom: rgbToHex(bottom), light: white };
  }
  function cityCoord(c){
    const o = cityOptions.find(x => x.city === c.city) || cityOptions.find(x => x.tz === c.tz);
    return o && o.lat !== undefined ? o : null;
  }
  // 没有经纬度时退回按当地钟点估算的天色
  function skyFor(c, date, hour24){
    const p = cityCoord(c);
    if(p){ const s = sunInfo(p.lat, p.lon, date.getTime()); return skyColors(s.elev, s.morning); }
    return skyColors(Math.sin((hour24 - 6) / 24 * 2 * Math.PI) * 60, hour24 < 12);
  }
  function applySky(el, sky){
    const key = sky.top + sky.bottom + (sky.light ? 'w' : 'd');
    if(el.__sky === key) return;
    el.__sky = key;
    el.style.setProperty('--sky-top', sky.top);
    el.style.setProperty('--sky-bottom', sky.bottom);
    el.style.setProperty('--card-bg', sky.bottom);
    el.style.setProperty('--card-text', sky.light ? '#FFFFFF' : 'var(--day-text)');
    el.style.setProperty('--card-border', sky.light ? 'transparent' : 'var(--day-border)');
    el.style.setProperty('--text-shadow', sky.light ? '0 1px 3px rgba(0,0,0,0.28)' : 'none');
  }

  function update(){
    const now = getSimulatedNow(); // 展示用的时间：真实时间 + 表盘拖动产生的偏移
    const cards = grid.querySelectorAll('.card');
    const baseOffset = getOffsetMinutes(cities[selectedIndex].tz, now); // 以选中城市为基准（用展示时间算，夏令时才准）

    cards.forEach((card, idx) => {
      const tz = card.dataset.tz;

      const dtf = getFmt('card', tz);
      const parts = {};
      dtf.formatToParts(now).forEach(p => parts[p.type] = p.value);

      const hour = parts.hour === '24' ? '00' : parts.hour;

      card.querySelector('[data-role="hm"]').textContent = `${hour}:${parts.minute}`;
      card.querySelector('[data-role="ss"]').textContent = parts.second;
      const dateStr = `${parts.year}-${parts.month}-${parts.day}`;
      if(card.__dateStr !== dateStr){
        card.__dateStr = dateStr;
        card.querySelector('[data-role="datetext"]').textContent = `${parts.year}/${parts.month}/${parts.day}`;
        card.querySelector('.date-input').value = dateStr;
      }

      const hourNum = parseInt(hour, 10);
      const minNum = parseInt(parts.minute, 10);
      const hour24 = hourNum + minNum / 60;

      applySky(card, skyFor(cities[idx], now, hour24));

      const offset = getOffsetMinutes(tz, now); // 展示时刻的 UTC 偏移（分钟）
      card.style.order = Math.round(offset);    // 卡片按偏移从西到东排列

      card.querySelector('[data-role="diff"]').textContent =
        idx === selectedIndex ? '' : formatDiff(offset - baseOffset);
    });
  }

  // ===== 表盘刻度与整时数字绘制 =====
  function buildDialTicks(){
    const ticksG = document.getElementById('dialTicks');
    const numsG = document.getElementById('dialNumbers');
    let ticksHtml = '';
    let numsHtml = '';
    for(let i = 0; i < 12; i++){
      const angle = i * 30;
      const major = (i % 3 === 0);
      const rOuter = 98;
      const rInner = major ? 82 : 90;
      ticksHtml += `<line class="tick${major ? ' major' : ''}" x1="100" y1="${100 - rOuter}" x2="100" y2="${100 - rInner}" transform="rotate(${angle} 100 100)"/>`;

      const hourLabel = i === 0 ? 12 : i;
      const rNum = 68;
      const rad = (angle - 90) * Math.PI / 180; // 0点方向对齐12点，顺时针
      const nx = 100 + rNum * Math.cos(rad);
      const ny = 100 + rNum * Math.sin(rad);
      numsHtml += `<text class="hour-number" x="${nx.toFixed(1)}" y="${ny.toFixed(1)}">${hourLabel}</text>`;
    }
    ticksG.innerHTML = ticksHtml;
    numsG.innerHTML = numsHtml;
  }

  // ===== 偏移状态：真实时间的指针角度 =====
  function dialAnglesAt(date){
    const p = {};
    getFmt('dial', dialTz).formatToParts(date).forEach(x => p[x.type] = x.value);
    let h = parseInt(p.hour, 10); if(h === 24) h = 0;
    const m = parseInt(p.minute, 10), sec = parseInt(p.second, 10);
    return { hourDeg: ((h % 12) + m / 60 + sec / 3600) * 30, minuteDeg: (m + sec / 60) * 6 };
  }

  function renderShiftState(){
    const shifted = Math.abs(timeOffsetMs) >= 1000;
    document.body.classList.toggle('time-shifted', shifted);
    if(!shifted) return;
    const real = dialAnglesAt(new Date());
    document.getElementById('ghostHour').setAttribute('transform', `rotate(${real.hourDeg} 100 100)`);
    document.getElementById('ghostMinute').setAttribute('transform', `rotate(${real.minuteDeg} 100 100)`);
  }

  // ===== 表盘指针与背景色刷新（跟随 getSimulatedNow） =====
  function updateDialFace(){
    const now = getSimulatedNow();
    const dtf = getFmt('dial', dialTz);
    const parts = {};
    dtf.formatToParts(now).forEach(p => parts[p.type] = p.value);

    let hour = parseInt(parts.hour, 10);
    if(hour === 24) hour = 0;
    const minute = parseInt(parts.minute, 10);
    const second = parseInt(parts.second, 10);

    const hourDeg = ((hour % 12) + minute / 60 + second / 3600) * 30;
    const minuteDeg = (minute + second / 60) * 6;
    const secondDeg = second * 6;

    document.getElementById('hourHand').setAttribute('transform', `rotate(${hourDeg} 100 100)`);
    document.getElementById('minuteHand').setAttribute('transform', `rotate(${minuteDeg} 100 100)`);
    document.getElementById('secondHand').setAttribute('transform', `rotate(${secondDeg} 100 100)`);
    renderShiftState();

    const hour24 = hour + minute / 60;
    applySky(document.getElementById('analogFaceWrap'), skyFor(cities[selectedIndex], now, hour24));
  }

  // ===== 拖动表盘：按下时指针保持原位，手指开始转动后按相对转动量拨动指针 =====
  const analogSvg = document.getElementById('analogSvg');
  const hubToggle = document.getElementById('hubToggle');
  let isDraggingDial = false;
  let dragLastAngle = 0;

  function angleFromPointer(e){
    const rect = analogSvg.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = e.clientX - cx;
    const dy = e.clientY - cy;
    let angle = Math.atan2(dx, -dy) * 180 / Math.PI; // 0 = 12点方向，顺时针增加
    if(angle < 0) angle += 360;
    return angle;
  }

  // 将手指转动的角度差换算成小时差，叠加到已有的时间偏移上（相对转动，而不是绝对对齐到手指角度）
  function applyDialDelta(deltaAngleDeg){
    timeOffsetMs += (deltaAngleDeg / 30) * 3600000;
    update();
    updateDialFace();
  }

  // ===== 齿轮式的“咔哒”音效 + 震动反馈，每转过一小格触发一次 =====
  let audioCtx = null;
  function ensureAudioCtx(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  // iOS Safari 对“可以解锁音频”的用户手势判定比较老旧，pointerdown 不一定算数，
  // 所以额外在最经典的几种手势事件上尝试解锁，并当场播放一个几乎无声的短促音，彻底“预热”音频链路
  let audioUnlocked = false;
  function unlockAudioOnce(){
    if(audioUnlocked) return;
    const ctx = ensureAudioCtx();
    if(!ctx) return;
    const buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.connect(ctx.destination);
    src.start(0);
    audioUnlocked = true;
  }
  ['touchstart', 'touchend', 'mousedown', 'click', 'keydown'].forEach(evt => {
    document.addEventListener(evt, unlockAudioOnce, { passive: true });
  });
  function playGearTick(){
    const ctx = ensureAudioCtx();
    if(!ctx) return;
    const now = ctx.currentTime;

    // 一小段带通滤波噪声，模拟棘爪咬住棘轮齿的瞬间摩擦声（偏明亮清脆，贴近常见的上发条声音）
    function ratchetBurst(startOffset, freq, gainPeak, dur){
      const bufferSize = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for(let i = 0; i < bufferSize; i++){
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
      }
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = freq;
      bp.Q.value = 3.2;
      const g = ctx.createGain();
      const t0 = now + startOffset;
      g.gain.setValueAtTime(gainPeak, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      src.connect(bp);
      bp.connect(g);
      g.connect(ctx.destination);
      src.start(t0);
      src.stop(t0 + dur);
    }

    // 发条棘轮转动时典型的“咔哒-咔”双击感（棘爪先咬住、再轻微回弹）
    ratchetBurst(0, 3200 + Math.random() * 500, 0.45, 0.011);
    ratchetBurst(0.009, 3700 + Math.random() * 500, 0.28, 0.009);
  }

  // ===== 慢拨精细：手指转得越慢，表盘走得越少（精细定位）；转得越快越接近 1:1（粗调） =====
  // 灵敏度曲线：在“手指角速度(°/秒) → 灵敏度”的锚点之间做对数插值。
  //   ≤ 50°/s  → 0.04（最慢：手指转 1° 表盘只走 0.04°，约 5 秒）
  //   120°/s   → 0.2
  //   ≥ 300°/s → 1（粗调，1:1）
  const GAIN_POINTS = [[50, 0.04], [120, 0.2], [300, 1]];
  let dragSpeedEma = 0, dragLastTs = 0, dragAccumMin = 0;
  function gainForSpeed(dps){
    const P = GAIN_POINTS;
    if(dps <= P[0][0]) return P[0][1];
    if(dps >= P[P.length - 1][0]) return 1;
    for(let i = 1; i < P.length; i++){
      if(dps <= P[i][0]){
        const [v0, g0] = P[i - 1], [v1, g1] = P[i];
        const t = Math.log(dps / v0) / Math.log(v1 / v0);
        return g0 * Math.pow(g1 / g0, t);
      }
    }
    return 1;
  }

  // 从圆心热区按下：不进入拖动（圆心处角度不稳定），松手时若几乎没移动就当作一次点击
  let hubPress = null;
  analogSvg.addEventListener('pointerdown', (e) => {
    if(e.target === hubToggle){
      hubPress = { id: e.pointerId, x: e.clientX, y: e.clientY };
      return;
    }
    cancelSweep();
    isDraggingDial = true;
    analogSvg.setPointerCapture(e.pointerId);
    dragLastAngle = angleFromPointer(e); // 只记录起始角度，指针本身不移动
    dragAccumMin = 0;
    dragSpeedEma = 0;          // 按下时速度记为 0：一开始是最细的灵敏度，随着手指加速再逐渐放大
    dragLastTs = e.timeStamp;
    ensureAudioCtx();
  });
  analogSvg.addEventListener('pointermove', (e) => {
    if(!isDraggingDial) return;
    const angle = angleFromPointer(e);
    let diff = angle - dragLastAngle; // 与上一次记录角度的差值（最短路径）
    while(diff > 180) diff -= 360;
    while(diff <= -180) diff += 360;
    dragLastAngle = angle;

    // 手指角速度（°/秒），做平滑，避免事件间隔抖动造成忽快忽慢
    const dt = Math.max(1, e.timeStamp - dragLastTs);
    dragLastTs = e.timeStamp;
    dragSpeedEma = dragSpeedEma * 0.65 + (Math.abs(diff) / dt * 1000) * 0.35;
    const gain = gainForSpeed(dragSpeedEma);

    const eff = diff * gain; // 实际作用到表盘的角度
    applyDialDelta(eff);

    // 咔哒反馈跟着“实际走过的时间”走：粗调每 10 分钟一格，精调（灵敏度低）每 1 分钟一格
    const gridMin = gain < 0.4 ? 1 : 10;
    dragAccumMin += Math.abs(eff) / 30 * 60; // 度 -> 分钟（30° = 1 小时）
    const ticksPassed = Math.min(Math.floor(dragAccumMin / gridMin), 4); // 最多连响 4 声，避免炸裂
    if(dragAccumMin >= gridMin){
      dragAccumMin = dragAccumMin % gridMin;
      if(tickSoundOn){ for(let i = 0; i < ticksPassed; i++) playGearTick(); } // 拨动的咔哒声也受圆心开关控制
      if(navigator.vibrate) navigator.vibrate(4);
    }
  });
  analogSvg.addEventListener('pointerup', (e) => {
    if(hubPress && hubPress.id === e.pointerId){
      const moved = Math.hypot(e.clientX - hubPress.x, e.clientY - hubPress.y);
      hubPress = null;
      if(moved < 10 && e.target === hubToggle) setTickSound(!tickSoundOn);
      return;
    }
    isDraggingDial = false;
    scheduleSecondLoop();
  });
  analogSvg.addEventListener('pointercancel', () => { hubPress = null; isDraggingDial = false; scheduleSecondLoop(); });

  const analogFaceWrap = document.getElementById('analogFaceWrap');
  document.addEventListener('dblclick', (e) => {
    if(analogFaceWrap.contains(e.target)) return; // 双击表盘本身不触发重置
    if(e.target.closest('.card')) return; // 连续点卡片切换城市时不误触重置
    if(cardIndexAtExtended(e.clientX, e.clientY) >= 0) return; // 连续点卡片上下的延伸带也不重置
    sweepOffsetToZero();
  });

  // 双击重置：不是瞬间跳回，而是约 0.5 秒缓动扫回真实时间（扫回期间不发秒针声）
  let sweepRaf = 0, isSweeping = false;
  function cancelSweep(){
    if(sweepRaf){ cancelAnimationFrame(sweepRaf); sweepRaf = 0; }
    isSweeping = false;
  }
  function sweepOffsetToZero(){
    cancelSweep();
    const from = timeOffsetMs;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(from === 0 || reduce){
      timeOffsetMs = 0; update(); updateDialFace();
      lastSoundSec = Math.floor(getSimulatedNow().getTime() / 1000);
      scheduleSecondLoop();
      return;
    }
    isSweeping = true;
    const t0 = performance.now(), DUR = 520;
    const step = (now) => {
      const p = Math.min(1, (now - t0) / DUR);
      const e = 1 - Math.pow(1 - p, 3); // easeOutCubic
      timeOffsetMs = from * (1 - e);
      update(); updateDialFace();
      if(p < 1){ sweepRaf = requestAnimationFrame(step); }
      else {
        timeOffsetMs = 0; update(); updateDialFace();
        lastSoundSec = Math.floor(getSimulatedNow().getTime() / 1000);
        scheduleSecondLoop();
        isSweeping = false; sweepRaf = 0;
      }
    };
    sweepRaf = requestAnimationFrame(step);
  }

  // ===== 15 / 30 / 45 秒的提示音：三个时刻都用同一个“响棒”声（短促的“嗒”，余响约 0.04 秒，和普通秒的“滴”一样短）=====
  // f 基频；r 各分音频率比；a 各分音音量；d 各分音衰减秒；at 起音秒数；c 起音处的噪声“咔” [频率, Q, 音量]；g 响度系数
  const CHIME_DEF = { f:2400, r:[1,2.6], a:[.5,.15], d:[.072,.036], at:.0008, c:[3500,3,.5], g:0.68 };
  // 整分（秒针转满 60 秒）：玉石声——温润、纯净的高音，余响约 0.3 秒
  const JADE_DEF = { f:3300, r:[1,2.4,4.6], a:[.3,.1,.04], d:[.55,.3,.15], at:.0008, c:[5000,2.5,.3], g:0.92 };
  function playChime(ctx, def, t0){
    const at = def.at || .003;
    def.r.forEach((r, i) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = def.f * r;
      const g = ctx.createGain(), pk = def.a[i] * def.g, d = def.d[i];
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(pk, t0 + at);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + at + d);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + at + d + .05);
    });
    if(def.c){
      const dur = .02, n = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, n, ctx.sampleRate), x = buf.getChannelData(0);
      for(let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.5);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = def.c[0]; f.Q.value = def.c[1];
      const g = ctx.createGain();
      g.gain.setValueAtTime(def.c[2] * def.g, t0);
      g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
      src.connect(f); f.connect(g); g.connect(ctx.destination);
      src.start(t0); src.stop(t0 + dur);
    }
  }

  // ===== 秒针走动声音 =====
  // 普通秒：机械手表的“滴”；15 / 30 / 45 秒（quarter = 1 / 2 / 3）：同一个响棒声，各一声；
  // 整分：玉石声（见 playMinuteDing）。
  function playSecondTick(quarter){
    const ctx = ensureAudioCtx();
    if(!ctx) return;
    const t0 = ctx.currentTime;

    if(!quarter){
      // click = 带通噪声“咔”，tone = 短促正弦共鸣；两者组合成手表擒纵机构的一前一后两个微小咔声
      const click = (at, dur, freq, Q, level, type) => {
        const size = Math.max(1, Math.floor(ctx.sampleRate * dur));
        const buf = ctx.createBuffer(1, size, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for(let i = 0; i < size; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / size, 2);
        const src = ctx.createBufferSource(); src.buffer = buf;
        const f = ctx.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = Q;
        const g = ctx.createGain();
        g.gain.setValueAtTime(level, t0 + at);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + at + dur);
        src.connect(f); f.connect(g); g.connect(ctx.destination);
        src.start(t0 + at); src.stop(t0 + at + dur);
      };
      const tone = (at, freq, peak, decay) => {
        const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t0 + at);
        g.gain.exponentialRampToValueAtTime(peak, t0 + at + 0.001);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + decay);
        o.connect(g); g.connect(ctx.destination);
        o.start(t0 + at); o.stop(t0 + at + decay + 0.02);
      };
      // 很轻很细的“滴”（两声之间约 0.03 秒）
      click(0, 0.007, 4800, 2.5, 1.21);
      tone(0, 3600, 0.154, 0.014);
      click(0.032, 0.006, 4200, 2.5, 0.66);
      tone(0.032, 3300, 0.088, 0.012);
      return;
    }

    playChime(ctx, CHIME_DEF, t0); // 15 / 30 / 45 秒
  }

  function playMinuteDing(){
    const ctx = ensureAudioCtx();
    if(!ctx) return;
    playChime(ctx, JADE_DEF, ctx.currentTime);
  }

  // 圆心开关：点一下开启声音（秒针变橙色），再点一下关闭（秒针与时针同色）。默认关闭。
  let tickSoundOn = false;
  function setTickSound(on){
    tickSoundOn = on;
    analogSvg.classList.toggle('sound-on', on);
    hubToggle.setAttribute('aria-pressed', on ? 'true' : 'false');
    if(on){
      ensureAudioCtx(); // 点击本身就是用户手势，顺便解锁音频（不额外发声）
    }
  }
  hubToggle.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); setTickSound(!tickSoundOn); }
  });

  // 以“模拟时间”的整秒跳变为准：画面刷新和声音同步触发。
  // 拖动表盘、双击重置造成的时间跳变不会发声（只有自然前进恰好1秒才发声）。
  let lastSoundSec = Math.floor(getSimulatedNow().getTime() / 1000);
  function secondLoop(){
    const sec = Math.floor(getSimulatedNow().getTime() / 1000);
    if(sec === lastSoundSec) return;
    const delta = sec - lastSoundSec;
    lastSoundSec = sec;
    update();
    updateDialFace();
    if(!tickSoundOn || isDraggingDial || isSweeping || delta !== 1 || document.hidden) return;
    const s60 = ((sec % 60) + 60) % 60;
    if(s60 === 0) playMinuteDing();
    else playSecondTick(s60 % 15 === 0 ? s60 / 15 : 0); // 15 / 30 / 45 秒用刻钟声，其余普通秒
  }

  renderCards();
  buildDialTicks();
  update();
  updateDialFace();
  // 对齐到“模拟时间”的下一个整秒再触发（原来每 50 毫秒轮询一次，每秒唤醒 20 次）
  let secondTimer = 0;
  function scheduleSecondLoop(){
    clearTimeout(secondTimer);
    const ms = 1000 - (getSimulatedNow().getTime() % 1000);
    secondTimer = setTimeout(() => { secondLoop(); scheduleSecondLoop(); }, ms + 4);
  }
  scheduleSecondLoop();
  document.addEventListener('visibilitychange', () => { if(!document.hidden){ secondLoop(); scheduleSecondLoop(); } });
</script>
