<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>全球主要股市交易时间</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48dGV4dCB5PSIuOWVtIiBmb250LXNpemU9IjkwIj7wn5OIPC90ZXh0Pjwvc3ZnPg==">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      color: #1e1e1e;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      gap: 16px;
    }
    .container {
      max-width: 1200px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
      padding: 16px 12px 12px 12px;
      overflow: visible;
      position: relative;
    }
    .timeline-wrapper {
      position: relative;
      overflow-x: auto;
      overflow-y: visible;
      padding-top: 24px;
      padding-bottom: 4px;
      border-radius: 8px;
      /* 让 sticky label 在滚动容器内生效 */
      -webkit-overflow-scrolling: touch;
    }
    .timeline-wrapper::-webkit-scrollbar {
      height: 6px;
      background: #f0f2f5;
      border-radius: 3px;
    }
    .timeline-wrapper::-webkit-scrollbar-track {
      background: #f0f2f5;
      border-radius: 3px;
    }
    .timeline-wrapper::-webkit-scrollbar-thumb {
      background: #d0d3d8;
      border-radius: 3px;
    }
    .timeline-wrapper::-webkit-scrollbar-thumb:hover {
      background: #b0b4bc;
    }
    .timeline {
      display: flex;
      flex-direction: column;
      /* JS 会动态写入 min-width */
      width: fit-content;
      margin: 0;
      padding-left: 0;
      position: relative;
      overflow: visible;
    }

    .tz-row, .market-row {
      display: flex;
      min-height: 30px;
      height: auto;
      border-bottom: 1px solid #eceef2;
      position: relative;
      width: 100%;
      align-items: stretch;
    }
    .market-row { min-height: 38px; border-bottom: 1px solid #f0f2f5; }
    .tz-row:last-of-type { border-bottom: 1px solid #d5d8de; }
    .market-row:last-child { border-bottom: none; }

    .tz-label, .market-label {
      flex: 0 0 var(--label-w, 130px);
      width: var(--label-w, 130px);
      min-width: var(--label-w, 130px);
      position: sticky;
      left: 0;
      z-index: 12;
      background: #ffffff;
      border-right: 1px solid #e6e8ec;
      display: flex;
      align-items: center;
      padding: 4px 10px;
      flex-shrink: 0;
      word-break: break-word;
      white-space: normal;
    }
    .tz-label {
      font-size: 10.5px;
      font-weight: 600;
      color: #4a4d5a;
      letter-spacing: 0.3px;
      background: #ffffff;
      align-items: flex-start;
    }
    .market-label {
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      background: #ffffff;
    }
    .market-name {
      font-size: 11px;
      font-weight: 600;
      color: #2d2f3a;
      letter-spacing: 0.2px;
      line-height: 1.3;
    }
    .market-tz {
      font-size: 9px;
      font-weight: 400;
      color: #9a9eae;
      line-height: 1.2;
      letter-spacing: 0.1px;
    }

    .tz-ticks, .market-track {
      flex: 0 0 auto;
      position: relative;
      height: auto;
      min-height: inherit;
      align-self: stretch;
      min-width: 0;
    }
    .market-track { min-height: 38px; }

    .tick {
      position: absolute;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 10.5px;
      font-weight: 600;
      color: #4a4d5a;
      font-variant-numeric: tabular-nums;
      font-family: "SF Mono", "Menlo", "Monaco", "Consolas", "Liberation Mono", "Courier New", monospace;
      width: 18px;
      transform: translateX(-50%);
      text-align: center;
      letter-spacing: 0;
      flex-shrink: 0;
      pointer-events: none;
    }

    .grid-dash {
      position: absolute;
      top: 0;
      width: 0.5px;
      height: 100%;
      background: rgba(180, 188, 200, 0.15);
      pointer-events: none;
      z-index: 1;
    }
    .grid-dash.major { background: rgba(160, 168, 184, 0.25); }

    .bar {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 26px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      white-space: nowrap;
      font-size: 9px;
      font-weight: 600;
      z-index: 2;
      padding: 0 5px;
      letter-spacing: 0.1px;
      transition: opacity 0.15s;
    }
    .bar.open   { background: #c8e6c9; border: 1px solid #388e3c; color: #1b5e20; }
    .bar.before { background: #e3eef9; border: 1px solid #4a8fc1; color: #1a4f7a; }
    .bar.after  { background: #faf0e0; border: 1px solid #b57c2e; color: #7a551f; }
    .bar.night  { background: #f0e8f0; border: 1px solid #8a5a8a; color: #5a3a5a; }
    .bar.break  { background: transparent; border: 1.5px dashed #c0c4ce; color: #9a9eae; font-size: 8.5px; font-weight: 500; }

    .bar-text-left { flex: 0 0 auto; padding-right: 3px; }
    .bar-text-right { flex: 0 0 auto; padding-left: 3px; }
    .bar-text-empty { visibility: hidden; }

    .hover-line {
      position: absolute;
      top: 0;
      width: 2px;
      background: #1f2a4a;
      pointer-events: none;
      z-index: 8;
      opacity: 0;
      transition: opacity 0.15s;
      box-shadow: 0 0 10px rgba(20,40,80,0.12);
      height: 100%;
      border-radius: 1px;
    }
    .hover-line.active { opacity: 1; }

    .hover-line .hover-label {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      background: #1f2a4a;
      color: #ffffff;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 10px;
      letter-spacing: 0.3px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-family: "SF Mono", "Menlo", "Consolas", monospace;
      box-shadow: 0 2px 8px rgba(20, 40, 80, 0.25);
    }
    .market-track-hover-time {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #1f2a4a;
      color: #ffffff;
      font-size: 9.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 7px;
      letter-spacing: 0.3px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-family: "SF Mono", "Menlo", "Consolas", monospace;
      box-shadow: 0 2px 6px rgba(20, 40, 80, 0.2);
      pointer-events: none;
      z-index: 9;
      opacity: 0;
      transition: opacity 0.15s;
    }

    /* 当前时间指示线 */
    .now-line {
      position: absolute;
      top: 0;
      width: 2px;
      background: transparent;
      pointer-events: none;
      z-index: 7;
      height: 100%;
      border-left: 2px dashed #e53935;
      transition: left 60s linear;
      box-shadow: 0 0 12px rgba(229, 57, 53, 0.15);
    }
    .now-line .now-label {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      background: #e53935;
      color: #ffffff;
      font-size: 9.5px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 10px;
      letter-spacing: 0.3px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-family: "SF Mono", "Menlo", "Consolas", monospace;
      box-shadow: 0 2px 8px rgba(229, 57, 53, 0.3);
      /* transform 由 JS 动态控制，避免被左侧 label 列遮挡 */
      transition: none;
    }

    .legend-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 14px;
      margin-top: 12px;
      padding: 8px 12px;
      background: #f7f8fa;
      border: 1px solid #e6e8ec;
      border-radius: 10px;
      width: 100%;
    }
    .leg-item { display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500; color: #4a4d5a; }
    .leg-swatch { width: 20px; height: 12px; border-radius: 3px; flex-shrink: 0; }
    .leg-swatch.before { background: #e3eef9; border: 1px solid #4a8fc1; }
    .leg-swatch.open   { background: #c8e6c9; border: 1px solid #388e3c; }
    .leg-swatch.after  { background: #faf0e0; border: 1px solid #b57c2e; }
    .leg-swatch.night  { background: #f0e8f0; border: 1px solid #8a5a8a; }
    .leg-swatch.break  { background: transparent; border: 1.5px dashed #c0c4ce; }

    .season-toggle {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 10.5px;
      color: #4a4d5a;
      font-weight: 500;
    }
    .season-toggle .date-display {
      font-weight: 500;
      color: #6a6e7e;
      background: #eef0f4;
      padding: 3px 12px;
      border-radius: 12px;
      font-size: 10.5px;
      letter-spacing: 0.2px;
    }
    .season-toggle .season-label {
      font-weight: 400;
      color: #9a9eae;
      font-size: 9.5px;
    }
    .season-toggle button {
      background: #e6e8ec;
      border: none;
      border-radius: 16px;
      padding: 3px 14px;
      font-size: 10.5px;
      font-weight: 600;
      color: #3d4050;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.15s;
      height: 26px;
    }
    .season-toggle button:hover { background: #d0d3d8; transform: scale(1.02); }
    .season-toggle button:active { transform: scale(0.96); }
    .season-toggle button.winter {
      background: #2b4a7a;
      color: #ffffff;
    }
    .season-toggle button.winter:hover { background: #1f3a60; }

    /* 平板 */
    @media (max-width: 768px) {
      body { padding: 10px; }
      .container { padding: 10px 8px 8px 8px; border-radius: 12px; }
      .timeline-wrapper { padding-top: 22px; }
      .tz-row { min-height: 26px; }
      .market-row { min-height: 34px; }
      .market-track { min-height: 34px; }
      .bar { height: 22px; }
    }
    /* 手机 */
    @media (max-width: 480px) {
      body { padding: 8px; }
      .container { padding: 8px 6px 6px 6px; border-radius: 10px; }
      .timeline-wrapper { padding-top: 20px; }
      .tz-row { min-height: 24px; }
      .market-row { min-height: 32px; }
      .market-track { min-height: 32px; }
      .bar { height: 20px; font-size: 8px; padding: 0 3px; }
      .legend-row { gap: 3px 8px; padding: 6px 8px; }
      .leg-item { font-size: 9.5px; }
      .leg-swatch { width: 16px; height: 10px; }
      .season-toggle { margin-left: 0; width: 100%; justify-content: flex-end; margin-top: 2px; }
      .season-toggle .date-display { font-size: 9.5px; padding: 2px 8px; }
      .season-toggle button { font-size: 9.5px; padding: 2px 10px; height: 22px; }
      .now-line .now-label { font-size: 8.5px; padding: 1px 8px; top: -16px; }
      .tick { font-size: 9px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="timeline-wrapper">
    <div class="timeline" id="timeline"></div>
  </div>

  <div class="legend-row">
    <div class="leg-item"><div class="leg-swatch before"></div>盘前</div>
    <div class="leg-item"><div class="leg-swatch open"></div>盘中</div>
    <div class="leg-item"><div class="leg-swatch after"></div>盘后</div>
    <div class="leg-item"><div class="leg-swatch night"></div>夜盘</div>
    <div class="leg-item"><div class="leg-swatch break"></div>午休</div>
    <div class="season-toggle">
      <span class="date-display" id="dateDisplay">2026/06/26</span>
      <button id="seasonBtn" class="">夏</button>
      <span class="season-label" id="seasonLabel">令时</span>
    </div>
  </div>

</div><!-- /main .container close before fx -->

<!-- 汇率换算独立容器 -->
<div class="container" id="fx-container">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:6px;">
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="font-size:13px; font-weight:700; color:#2d2f3a; letter-spacing:0.2px;">汇率换算</span>
      <span id="fx-base-label" style="font-size:10px; color:#9a9eae; font-weight:400;">基准：USD</span>
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <span id="fx-update-time" style="font-size:9.5px; color:#b0b4bc;"></span>
      <button id="fx-refresh-btn" title="刷新汇率" style="background:#f0f2f5; border:1px solid #e0e2e8; border-radius:8px; padding:3px 10px; font-size:10px; color:#4a4d5a; cursor:pointer; display:flex; align-items:center; gap:4px; transition:background 0.15s;">
        <span id="fx-refresh-icon" style="display:inline-block; transition:transform 0.6s;">↻</span> 刷新
      </button>
    </div>
  </div>
  <div id="fx-rows" style="display:flex; flex-direction:column; gap:0;"></div>
  <div id="fx-error" style="display:none; font-size:10.5px; color:#e53935; padding:6px 0; text-align:center;"></div>
</div>

<style>
  .fx-row {
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid #f0f2f5;
    padding: 8px 6px;
    gap: 0;
    transition: background 0.12s;
    overflow: hidden;
  }
  .fx-row:last-child { border-bottom: none; }
  .fx-row:hover { background: #f7f8fb; border-radius: 8px; }
  .fx-row.active-row { background: #c8e6c9; border-radius: 8px; border: 1px solid #388e3c; margin: -1px -1px; }

  /* 上行：flag + 名称 + 输入框 */
  .fx-top-line {
    display: flex;
    align-items: center;
    gap: 0;
    width: 100%;
  }
  .fx-flag-sm {
    font-size: 16px;
    line-height: 1;
  }
  .fx-sub {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 1px;
  }
  .fx-symbol-text {
    font-size: 11px;
    font-weight: 600;
    color: #9a9eae;
  }
  .fx-left-col {
    flex: 0 0 92px;
    width: 92px;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    overflow: hidden;
  }
  .fx-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    gap: 1px;
  }
  .fx-name { font-size: 11px; font-weight: 700; color: #2d2f3a; letter-spacing: 0.3px; }


  /* 下行：badge 独占一行，缩进对齐货币名称 */
  .fx-badge-row {
    padding-left: 0;
    padding-top: 3px;
  }
  .fx-rate-badge {
    display: inline-block;
    font-size: 8.5px;
    color: #6a9fd8;
    background: #e8f1fb;
    border-radius: 4px;
    padding: 1px 6px;
    font-weight: 500;
    white-space: nowrap;
    line-height: 1.5;
  }
  .fx-input-wrap {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    align-items: center;
    position: relative;
    margin-left: 10px;
  }
  /* 使用 text 类型输入框，手动处理逗号格式化 */
  .fx-input {
    width: 100%;
    border: 1.5px solid #e0e2e8;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 600;
    color: #1e1e1e;
    background: #ffffff;
    outline: none;
    font-variant-numeric: tabular-nums;
    font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
    text-align: right;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .fx-input:focus {
    border-color: #4a8fc1;
    box-shadow: 0 0 0 3px rgba(74,143,193,0.12);
  }


  @media (max-width: 480px) {
    .fx-left-col { flex: 0 0 64px; width: 64px; }
    .fx-name { font-size: 10.5px; }
    .fx-rate-badge { font-size: 8px; }
    /* font-size 16px 防止 iOS 自动缩放 */
    .fx-input { font-size: 16px; padding: 6px 12px; }
    .fx-input-wrap { margin-left: 6px; }
  }
</style>

<script>
  (function() {
    const CURRENCIES = [
      { code: 'USD', name: '美元', full: 'US Dollar',      flag: '🇺🇸', symbol: '$' },
      { code: 'JPY', name: '日元', full: 'Japanese Yen',   flag: '🇯🇵', symbol: '¥' },
      { code: 'KRW', name: '韩元', full: 'Korean Won',     flag: '🇰🇷', symbol: '₩' },
      { code: 'CNY', name: '人民币', full: 'Chinese Yuan', flag: '🇨🇳', symbol: '¥' },
      { code: 'EUR', name: '欧元', full: 'Euro',           flag: '🇪🇺', symbol: '€' },
      { code: 'GBP', name: '英镑', full: 'British Pound',  flag: '🇬🇧', symbol: '£' },
    ];

    let rates = {};
    let activeCode = 'USD';
    // 存储每个货币的纯数值（未格式化）
    let numericValues = {}; // code -> number | null

    const fxError   = document.getElementById('fx-error');
    const fxUpdateTime = document.getElementById('fx-update-time');
    const fxBaseLabel  = document.getElementById('fx-base-label');

    // ── 数字格式化（带千分位逗号）────────────────────────────────
    // 最多 6 位小数，去掉末尾多余的零
    function formatWithCommas(val) {
      if (val === null || val === undefined || isNaN(val)) return '';
      // 最多保留6位有效小数，去掉末尾零
      let fixed = val.toFixed(6);
      // 去掉小数末尾的零；如果小数部分全是零则去掉小数点
      fixed = fixed.replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
      const [intPart, decPart] = fixed.split('.');
      const intFormatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return decPart !== undefined ? `${intFormatted}.${decPart}` : intFormatted;
    }

    // badge 始终显示 6 位小数，统一格式 1 XXX = x.xxxxxx YYY
    function formatBadge(val) {
      if (val === null || val === undefined || isNaN(val)) return '—';
      const fixed = val.toFixed(6);
      const [intPart, decPart] = fixed.split('.');
      const intFormatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return `${intFormatted}.${decPart}`;
    }

    // 去掉逗号还原纯数字字符串
    function stripCommas(str) {
      return str.replace(/,/g, '');
    }

    // ── badge 文字（基准货币切换后刷新）──────────────────────────
    function updateBadges() {
      CURRENCIES.forEach(cur => {
        const badge = document.getElementById('fx-badge-' + cur.code);
        if (!badge) return;
        if (!rates[cur.code] || !rates[activeCode]) { badge.textContent = '—'; return; }
        // 1 activeCode = ? cur.code
        const rate = rates[cur.code] / rates[activeCode];
        badge.textContent = `1 ${activeCode} = ${formatBadge(rate)} ${cur.code}`;
      });
    }

    // ── 更新时间格式 yyyy/mm/dd hh:mm ────────────────────────────
    function formatUpdateTime(d) {
      const y  = d.getFullYear();
      const mo = String(d.getMonth() + 1).padStart(2, '0');
      const dy = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `更新于 ${y}/${mo}/${dy} ${hh}:${mm}`;
    }

    // ── 将 activeCode 的当前数值传播到其他行 ─────────────────────
    function propagate(fromCode, fromValue) {
      if (!rates[fromCode]) return;
      const usdValue = fromValue / rates[fromCode];
      CURRENCIES.forEach(c => {
        if (c.code === fromCode) return;
        const el = document.getElementById('fx-input-' + c.code);
        if (!el) return;
        if (!rates[c.code]) { el.value = ''; numericValues[c.code] = null; return; }
        const converted = usdValue * rates[c.code];
        numericValues[c.code] = converted;
        el.value = formatWithCommas(converted);
      });
    }

    function clearAll() {
      CURRENCIES.forEach(c => {
        numericValues[c.code] = null;
        const el = document.getElementById('fx-input-' + c.code);
        if (el) el.value = '';
      });
    }

    // ── 构建行 ────────────────────────────────────────────────────
    function buildRows() {
      const fxRows = document.getElementById('fx-rows');
      fxRows.innerHTML = '';
      CURRENCIES.forEach(cur => {
        const row = document.createElement('div');
        row.className = 'fx-row';
        row.id = 'fx-row-' + cur.code;

        row.innerHTML = `
          <div class="fx-top-line">
            <div class="fx-left-col">
              <div class="fx-info">
                <div class="fx-name">${cur.code} ${cur.name}</div>
                <div class="fx-sub"><span class="fx-flag-sm">${cur.flag}</span><span class="fx-symbol-text">${cur.symbol}</span></div>
              </div>
            </div>
            <div class="fx-input-wrap">
            <input class="fx-input" id="fx-input-${cur.code}" type="text"
              inputmode="decimal" placeholder="0" autocomplete="off" />
            </div>
          </div>
          <div class="fx-badge-row">
            <div class="fx-rate-badge" id="fx-badge-${cur.code}">加载中…</div>
          </div>
        `;
        fxRows.appendChild(row);

        const input = row.querySelector('.fx-input');

        // 选中行：切换主货币 + 高亮 + 清空
        function activateRow() {
          activeCode = cur.code;
          clearAll();
          fxBaseLabel.textContent = `基准：${cur.code}`;
          updateBadges();
          document.querySelectorAll('.fx-row').forEach(r => r.classList.remove('active-row'));
          row.classList.add('active-row');
        }

        // 点击整行触发选中（输入框自身的 focus 也会冒泡到 row 的 click，用 pointerdown 更准确）
        row.addEventListener('pointerdown', (e) => {
          activateRow();
          // 若点的不是输入框，手动 focus 输入框
          if (e.target !== input) {
            e.preventDefault(); // 阻止默认，避免触发 blur/focus 顺序问题
            input.focus();
          }
        });

        // input：输入中只格式化整数千分位，保留小数输入中间态
        // 判断是否含算式字符（含 + - * / ( ) 空格）
        function isExpression(s) {
          return /[+*\/()]/.test(s) || /\d\s*-/.test(s);
        }

        // 安全求值：只允许数字和 + - * / ( ) . 空格
        function safeEval(expr) {
          const sanitized = expr.replace(/[^\d+\-*/().\s]/g, '');
          try {
            // eslint-disable-next-line no-new-func
            const result = Function('"use strict"; return (' + sanitized + ')')();
            if (typeof result === 'number' && isFinite(result)) return result;
          } catch(e) {}
          return null;
        }

        input.addEventListener('input', () => {
          const raw = stripCommas(input.value);

          // 空输入：清空所有
          if (raw.trim() === '') {
            numericValues[cur.code] = null;
            input.style.color = '';
            CURRENCIES.forEach(c => {
              if (c.code === cur.code) return;
              const el = document.getElementById('fx-input-' + c.code);
              if (el) { el.value = ''; numericValues[c.code] = null; }
            });
            return;
          }

          if (isExpression(raw)) {
            // 算式：实时求值传播，输入框保留原始文字让用户继续编辑
            const result = safeEval(raw);
            if (result !== null && isFinite(result)) {
              input.style.color = '#4a8fc1'; // 蓝色提示"算式模式"
              numericValues[cur.code] = result;
              propagate(cur.code, result);
            } else {
              // 算式还未完成（如 "100+"），不传播但也不报错
              input.style.color = '#4a8fc1';
            }
            return;
          }

          // 纯数字路径：实时千分位格式化
          input.style.color = '';
          const cleaned = raw.replace(/[^\d.\-]/g, '');
          if (cleaned === '' || cleaned === '-' || cleaned === '.' || cleaned === '-.') {
            numericValues[cur.code] = null;
            return;
          }

          const num = parseFloat(cleaned);
          if (isNaN(num)) return;
          numericValues[cur.code] = num;

          // 整数部分加千分位，小数部分保留用户输入原样
          const cursor = input.selectionStart;
          const oldLen = input.value.length;
          const hasTrailingDot = cleaned.endsWith('.');
          const parts = cleaned.split('.');
          const intFormatted = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
          let liveFormatted;
          if (hasTrailingDot) {
            liveFormatted = intFormatted + '.';
          } else if (parts.length > 1) {
            liveFormatted = intFormatted + '.' + parts[1];
          } else {
            liveFormatted = intFormatted;
          }
          input.value = liveFormatted;
          const diff = liveFormatted.length - oldLen;
          try { input.setSelectionRange(cursor + diff, cursor + diff); } catch(e) {}

          propagate(cur.code, num);
        });

        // blur：算式→替换为结果数字，纯数字→完整6位格式化
        input.addEventListener('blur', () => {
          const raw = stripCommas(input.value).trim();
          input.style.color = '';
          if (raw === '') return;

          let num = null;
          if (isExpression(raw)) {
            num = safeEval(raw);
          } else {
            const n = parseFloat(raw.replace(/[^\d.\-]/g, ''));
            if (!isNaN(n)) num = n;
          }

          if (num !== null && isFinite(num)) {
            numericValues[cur.code] = num;
            input.value = formatWithCommas(num);
            propagate(cur.code, num);
          } else {
            input.value = '';
            numericValues[cur.code] = null;
          }
        });
      });
    }

    // ── 本地缓存 key ─────────────────────────────────────────────
    const CACHE_KEY = 'fx_rates_cache';
    const CACHE_TTL = 6 * 60 * 60 * 1000; // 6小时内复用缓存

    function saveCache(ratesObj) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
          rates: ratesObj,
          ts: Date.now()
        }));
      } catch(e) {}
    }

    function loadCache() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (!obj || !obj.rates || !obj.ts) return null;
        return obj; // { rates, ts }
      } catch(e) { return null; }
    }

    // ── 拉取汇率 ─────────────────────────────────────────────────
    async function fetchRates() {
      const btn  = document.getElementById('fx-refresh-btn');
      const icon = document.getElementById('fx-refresh-icon');
      if (btn) btn.disabled = true;
      if (icon) icon.style.transform = 'rotate(360deg)';
      fxError.style.display = 'none';

      // 先尝试从缓存读取（6小时内有效）
      const cache = loadCache();
      const cacheValid = cache && (Date.now() - cache.ts) < CACHE_TTL;

      try {
        const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
        if (!res.ok) throw new Error('网络错误');
        const data = await res.json();
        rates = { USD: 1 };
        CURRENCIES.forEach(c => {
          if (data.rates[c.code] !== undefined) rates[c.code] = data.rates[c.code];
        });
        saveCache(rates);
        fxUpdateTime.textContent = formatUpdateTime(new Date());
        updateBadges();
        // 重新传播
        const v = numericValues[activeCode];
        if (v !== null && v !== undefined && !isNaN(v)) propagate(activeCode, v);
      } catch(e) {
        if (cacheValid) {
          // 网络失败但有有效缓存
          rates = cache.rates;
          const cacheDate = new Date(cache.ts);
          fxUpdateTime.textContent = formatUpdateTime(cacheDate) + '（缓存）';
          fxError.style.display = 'block';
          fxError.textContent = '⚠ 网络不可用，显示缓存汇率';
        } else if (cache) {
          // 缓存过期但总比没有强
          rates = cache.rates;
          const cacheDate = new Date(cache.ts);
          fxUpdateTime.textContent = formatUpdateTime(cacheDate) + '（过期缓存）';
          fxError.style.display = 'block';
          fxError.textContent = '⚠ 网络不可用，显示过期缓存汇率';
        } else {
          // 完全没有缓存，用写死的兜底值
          rates = { USD:1, JPY:157.5, KRW:1380, CNY:7.24, EUR:0.918, GBP:0.787 };
          fxUpdateTime.textContent = '参考汇率（离线）';
          fxError.style.display = 'block';
          fxError.textContent = '⚠ 汇率加载失败，使用离线参考汇率';
        }
        updateBadges();
      } finally {
        if (btn) btn.disabled = false;
        setTimeout(() => { if (icon) icon.style.transform = 'rotate(0deg)'; }, 700);
      }
    }

    document.getElementById('fx-refresh-btn').addEventListener('click', fetchRates);

    buildRows();
    fetchRates();
  })();
</script>

    applyCSSVars();

    function isDaylightSavingTime() {
      const now = new Date();
      const year = now.getFullYear();
      const march = new Date(year, 2, 1);
      const marchSecondSunday = new Date(year, 2, 1 + (8 - march.getDay()) % 7 + 7);
      const november = new Date(year, 10, 1);
      const novemberFirstSunday = new Date(year, 10, 1 + (7 - november.getDay()) % 7);
      const current = new Date();
      return current >= marchSecondSunday && current < novemberFirstSunday;
    }

    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      const weeks = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      const w = weeks[date.getDay()];
      return `${y}/${m}/${d} ${w}`;
    }

    function formatTime(date) {
      const h = String(date.getHours()).padStart(2, '0');
      const m = String(date.getMinutes()).padStart(2, '0');

      '伦敦 LSE': 'UTC+1（夏）',
      '纽约 NYSE': 'UTC−4（夏）'
    };

    let isWinter = !isDaylightSavingTime();

    function splitLabel(label) {
      if (!label) return { left: '', right: '' };
      const parts = label.split('–');
      if (parts.length === 2) return { left: parts[0].trim(), right: parts[1].trim() };
      const parts2 = label.split('-');
      if (parts2.length === 2) return { left: parts2[0].trim(), right: parts2[1].trim() };
      return { left: label, right: '' };
    }

    function getWinterData(markets) {
      return markets.map(mkt => {
        if (mkt.isEU || mkt.isUS) {
          return {
            ...mkt,
            utcOffset: mkt.utcOffset - 1,
            bars: mkt.bars.map(bar => ({
              ...bar,
              start: bar.start + 1,
              end: bar.end + 1
            }))
          };
        }
        return { ...mkt };
      });
    }

    // 计算当前北京时间在时间轴上的偏移（相对于 START，范围 0~24）
    function getNowPosition() {
      const now = new Date();
      const utcH = now.getUTCHours();
      const utcM = now.getUTCMinutes();
      const utcS = now.getUTCSeconds();
      // 北京时间 = UTC+8
      let bjH = (utcH + 8) % 24;
      const totalMinutes = (bjH - START) * 60 + utcM + utcS / 60;
      if (totalMinutes >= 0 && totalMinutes < 24 * 60) {
        return totalMinutes / 60;
      } else {
        return 24 + totalMinutes / 60;
      }
    }

    function render(season) {
      // 重新计算布局（响应屏幕尺寸变化）
      layout = getLayout();
      HR = layout.HR;
      LABEL_WIDTH = layout.LABEL_WIDTH;
      applyCSSVars();

      const isWinterMode = season === 'winter';
      const data = isWinterMode ? getWinterData(baseMarkets) : baseMarkets.map(m => ({ ...m }));

      data.forEach(mkt => {
        if (mkt.isEU || mkt.isUS) {
          mkt.tz = isWinterMode ? winterLabels[mkt.name] : summerLabels[mkt.name];
        }
      });

      const tl = document.getElementById('timeline');
      tl.innerHTML = '';
      tl.style.minWidth = (LABEL_WIDTH + TOTAL * HR) + 'px';

      const tzConfigs = [
        { label: '东京/首尔 (UTC+9)', offset: 1 },
        { label: '北京时间 (UTC+8)', offset: 0 },
        { label: isWinterMode ? '纽约 EST (UTC−5)' : '纽约 EDT (UTC−4)', offset: isWinterMode ? -13 : -12 }

      tzConfigs.forEach(tz => {
        const row = document.createElement('div');
        row.className = 'tz-row';

        const label = document.createElement('div');
        label.className = 'tz-label';
        label.textContent = tz.label;
        row.appendChild(label);

        const ticks = document.createElement('div');
        ticks.className = 'tz-ticks';
        // 固定宽度 = TOTAL * HR，所有元素用 left = i * HR，tick 用 translateX(-50%) 居中
        ticks.style.width = (TOTAL * HR) + 'px';

        for (let i = 0; i <= TOTAL; i++) {
          const bjH = (START + i) % 24;
          let localH = (bjH + tz.offset) % 24;
          if (localH < 0) localH += 24;

          const tick = document.createElement('div');
          tick.className = 'tick';
          tick.style.left = (i * HR) + 'px';
          tick.textContent = Math.floor(localH).toString().padStart(2, '0');
          // 第一个 tick 靠左对齐，最后一个靠右对齐，避免被遮挡或溢出
          if (i === 0) tick.style.transform = 'translateX(0)';
          else if (i === TOTAL) tick.style.transform = 'translateX(-100%)';
          ticks.appendChild(tick);

          const dash = document.createElement('div');
          dash.className = 'grid-dash' + (i % 2 === 0 ? ' major' : '');
          dash.style.left = (i * HR) + 'px';
          ticks.appendChild(dash);

        row.appendChild(ticks);
        tl.appendChild(row);

      data.forEach(mkt => {
        const row = document.createElement('div');
        row.className = 'market-row';

        const label = document.createElement('div');
        label.className = 'market-label';
        label.innerHTML = `<div class="market-name">${mkt.name}</div><div class="market-tz">${mkt.tz}</div>`;

        const track = document.createElement('div');
        track.className = 'market-track';
        track.style.width = (TOTAL * HR) + 'px';

        // 悬停时显示的本地时间标签

        for (let i = 0; i <= TOTAL; i++) {
          const dash = document.createElement('div');
          dash.className = 'grid-dash' + (i % 2 === 0 ? ' major' : '');
          dash.style.left = (i * HR) + 'px';
          track.appendChild(dash);

          const colStart = bar.start - START;
          const colEnd = bar.end - START;
          const left = Math.max(0, colStart) * HR;
          const right = Math.min(TOTAL, colEnd) * HR;
          const width = right - left;

          const el = document.createElement('div');
          el.className = 'bar ' + bar.type;
          el.style.left = left + 'px';
          el.style.width = width + 'px';

          const { left: leftText, right: rightText } = splitLabel(bar.label || '');

          const spanLeft = document.createElement('span');
          spanLeft.className = 'bar-text-left' + (showText && leftText ? '' : ' bar-text-empty');
          spanLeft.textContent = showText ? leftText : '';

          const spanRight = document.createElement('span');
          spanRight.className = 'bar-text-right' + (showText && rightText ? '' : ' bar-text-empty');
          spanRight.textContent = showText ? rightText : '';

          el.appendChild(spanLeft);
          el.appendChild(spanRight);
          track.appendChild(el);
        });

        row.appendChild(track);
        tl.appendChild(row);
      });

      // ---- 统一坐标函数 ----
      // track 容器的 left 相对于 timeline 元素 = LABEL_WIDTH（sticky label 宽度）
      // track 内 left = (t - START) * HR
      // 所以相对于 timeline：px = LABEL_WIDTH + (t - START) * HR
      function timeToX(t) {
        return LABEL_WIDTH + (t - START) * HR;
      }
      function xToTime(px) {
        return START + (px - LABEL_WIDTH) / HR;
      }

      // ---- 鼠标悬停线 ----
      const hoverLine = document.createElement('div');
      hoverLine.className = 'hover-line';
      tl.appendChild(hoverLine);

      const wrapper = tl.closest('.timeline-wrapper');

      // 固定状态：是否已点击锁定（每次 render 重置）
      let pinnedX = null;

      function applyPosition(px, showLabels) {
        const trackLocalX = px - LABEL_WIDTH;
        const bjTime = xToTime(px);

        hoverLine.style.left = px + 'px';
        hoverLine.classList.add('active');

        tl.querySelectorAll('.market-track').forEach(trackEl => {
          const offset = parseFloat(trackEl.dataset.utcOffset);
          if (isNaN(offset)) return;
          const localH = (bjTime + (offset - 8) + 48) % 24;
          const lhh = Math.floor(localH).toString().padStart(2, '0');
          const lmm = Math.floor((localH % 1) * 60).toString().padStart(2, '0');
          const timeEl = trackEl.querySelector('.market-track-hover-time');
          if (timeEl) {
            timeEl.style.left = trackLocalX + 'px';
            timeEl.textContent = `${lhh}:${lmm}`;
            timeEl.style.opacity = showLabels ? '1' : '0';
          }
        });
      }

      tl.addEventListener('mousemove', (e) => {
        // 已固定时，鼠标移动不改变任何状态
        if (pinnedX !== null) return;

        const tlRect = tl.getBoundingClientRect();
        const x = e.clientX - tlRect.left;

        const trackStart = LABEL_WIDTH;
        const trackEnd = LABEL_WIDTH + TOTAL * HR;

        if (x < trackStart || x > trackEnd) {
          hoverLine.classList.remove('active');
          return;
        }

        const px = Math.min(trackEnd, Math.max(trackStart, x));
        // 悬停：只显示竖线，不显示时间标签
        applyPosition(px, false);
      });

      tl.addEventListener('mouseleave', () => {
        // 已固定时，鼠标离开不隐藏
        if (pinnedX !== null) return;
        hoverLine.classList.remove('active');
        tl.querySelectorAll('.market-track-hover-time').forEach(el => { el.style.opacity = '0'; });
      });

      function cancelPin() {
        pinnedX = null;
        hoverLine.classList.remove('active');
        hoverLine.classList.remove('pinned');
        tl.querySelectorAll('.market-track-hover-time').forEach(el => { el.style.opacity = '0'; });
      }

      tl.addEventListener('click', (e) => {
        const tlRect = tl.getBoundingClientRect();
        const x = e.clientX - tlRect.left;

        const trackStart = LABEL_WIDTH;
        const trackEnd = LABEL_WIDTH + TOTAL * HR;

        if (x < trackStart || x > trackEnd) {
          // 点击了 label 区域，取消固定
          cancelPin();
          return;
        }

        const px = Math.min(trackEnd, Math.max(trackStart, x));

        // 若已在同一位置点击则取消固定，否则固定到新位置
        if (pinnedX !== null && Math.abs(px - pinnedX) < 2) {
          cancelPin();
        } else {
          pinnedX = px;
          hoverLine.classList.add('pinned');
          applyPosition(px, true);
        }

        // 阻止冒泡，避免触发 document 的取消逻辑
        e.stopPropagation();
      });

      // 点击时间轴外部任意区域也取消锁定
      function onDocClick() {
        if (pinnedX !== null) cancelPin();
      }
      document.addEventListener('click', onDocClick);

      // ---- 触摸支持 ----
      // touchMode: null | 'drag-line' | 'scroll-track'
      let touchMode = null;
      let touchStartClientX = 0;
      let touchStartScrollLeft = 0;
      const HOVER_LINE_HIT = 24; // 悬停线左右各 24px 视为命中

      tl.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        const tlRect = tl.getBoundingClientRect();
        // x 是相对于 timeline 内部的坐标（已含滚动偏移）
        const x = touch.clientX - tlRect.left;
        const trackStart = LABEL_WIDTH;
        const trackEnd = LABEL_WIDTH + TOTAL * HR;

        if (x < trackStart || x > trackEnd) {
          // 触点在 label 列或轨道外，不干预（让页面正常滚动）
          touchMode = null;
          return;
        }

        touchStartClientX = touch.clientX;
        touchStartScrollLeft = wrapper.scrollLeft;

        // 判断是否点在悬停线附近
        if (pinnedX !== null && Math.abs(x - pinnedX) <= HOVER_LINE_HIT) {
          // 拖动悬停线模式：阻止滚动
          touchMode = 'drag-line';
          e.preventDefault();
        } else {
          // 滚动时间轴模式：让 wrapper 自然处理横向滚动即可
          // 但需要 preventDefault 才能控制，所以手动实现滚动
          touchMode = 'scroll-track';
          e.preventDefault();
        }
      }, { passive: false });

      tl.addEventListener('touchmove', (e) => {
        if (!touchMode) return;
        e.preventDefault();

        const touch = e.touches[0];
        const dx = touch.clientX - touchStartClientX;

        if (touchMode === 'drag-line') {
          // 只移动悬停线，时间轴不滚动
          // pinnedX 是 timeline 内部坐标，手指在屏幕上移动 dx，
          // 因为时间轴没有滚动，timeline 内坐标也同样偏移 dx
          const trackStart = LABEL_WIDTH;
          const trackEnd = LABEL_WIDTH + TOTAL * HR;
          const newPx = Math.min(trackEnd, Math.max(trackStart, pinnedX + dx));
          // 实时更新显示但不固定 pinnedX（松手再固定）
          applyPosition(newPx, true);
        } else {
          // 滚动时间轴，悬停线保持在时间轴上的绝对位置不动
          wrapper.scrollLeft = touchStartScrollLeft - dx;
        }
      }, { passive: false });

      tl.addEventListener('touchend', (e) => {
        if (!touchMode) return;

        const touch = e.changedTouches[0];
        const dx = touch.clientX - touchStartClientX;

        if (touchMode === 'drag-line') {
          // 松手：固定悬停线到新位置
          const trackStart = LABEL_WIDTH;
          const trackEnd = LABEL_WIDTH + TOTAL * HR;
          pinnedX = Math.min(trackEnd, Math.max(trackStart, pinnedX + dx));
          hoverLine.classList.add('pinned');
          applyPosition(pinnedX, true);
        } else {
          // 轻触（几乎没有移动）：设置悬停线
          if (Math.abs(dx) < 6) {
            const tlRect = tl.getBoundingClientRect();
            const x = touch.clientX - tlRect.left;
            const trackStart = LABEL_WIDTH;
            const trackEnd = LABEL_WIDTH + TOTAL * HR;
            const px = Math.min(trackEnd, Math.max(trackStart, x));
            pinnedX = px;
            hoverLine.classList.add('pinned');
            applyPosition(px, true);
          }
        }

        touchMode = null;
      });

      // ---- 当前时间指示线（两条，间隔24小时）----
      function makeNowLine(showLabel) {
        const line = document.createElement('div');
        line.className = 'now-line';
        if (showLabel) {
          const lbl = document.createElement('span');
          lbl.className = 'now-label';
          lbl.textContent = '--:--:--';
          line.appendChild(lbl);
        }
        tl.appendChild(line);
        return line;
      }

      const nowLine1 = makeNowLine(true);
      const nowLine2 = makeNowLine(true);

      // 标签宽度约 70px，安全边距留 4px
      const LABEL_HALF = 38;

      function adjustNowLabel(line, lineLeft) {
        const lbl = line.querySelector('.now-label');
        if (!lbl) return;
        // lineLeft 是红线相对于 timeline 元素的 left 值（px）
        // 标签 left:50% 即挂在红线中心（lineLeft + 1px）
        // 左侧可用空间：lineLeft - LABEL_WIDTH（sticky列宽）
        const leftSpace = lineLeft - LABEL_WIDTH;
        const trackWidth = TOTAL * HR;
        const rightSpace = trackWidth - (lineLeft - LABEL_WIDTH);

        if (leftSpace < LABEL_HALF + 4) {
          // 靠近左边：标签向右偏，左边缘对齐红线
          lbl.style.transform = 'translateX(-4px)';
        } else if (rightSpace < LABEL_HALF + 4) {
          // 靠近右边：标签向左偏，右边缘对齐红线
          lbl.style.transform = 'translateX(calc(-100% + 4px))';
        } else {
          // 中间：居中
          lbl.style.transform = 'translateX(-50%)';
        }
      }

      function updateNowLine() {
        const pos = getNowPosition(); // 0~24，相对于 START 的小时偏移

        // 第一条：在前24小时区段（pos: 0~24）
        const pos1 = Math.min(24, Math.max(0, pos));
        const left1 = timeToX(START + pos1);
        nowLine1.style.left = left1 + 'px';
        nowLine1.style.display = '';
        adjustNowLabel(nowLine1, left1);

        // 第二条：在后24小时区段（pos+24: 24~48）
        const pos2 = pos + 24;
        const left2 = timeToX(START + pos2);
        nowLine2.style.left = left2 + 'px';
        nowLine2.style.display = (pos2 <= TOTAL) ? '' : 'none';
        adjustNowLabel(nowLine2, left2);

        const timeStr = formatTime(new Date());
        [nowLine1, nowLine2].forEach(line => {
          const lbl = line.querySelector('.now-label');
          if (lbl) lbl.textContent = timeStr;
        });
      }

      // 立即更新
      setTimeout(updateNowLine, 50);

      // 初始滚动：让红色时间线距左侧标签列约 5 小时位置
      setTimeout(() => {
        const pos = getNowPosition(); // 0~24
        // 红线在 timeline 内的 left 值
        const nowLeft = timeToX(START + Math.min(24, Math.max(0, pos)));
        // 目标滚动量 = 红线位置 - 标签列宽 - 5小时像素
        const targetScroll = nowLeft - LABEL_WIDTH - 5 * HR;
        wrapper.scrollLeft = Math.max(0, targetScroll);
      }, 80);

      // 每秒更新时间标签
      const timeInterval = setInterval(() => {
        const timeStr = formatTime(new Date());
        [nowLine1, nowLine2].forEach(line => {
          const lbl = line.querySelector('.now-label');
          if (lbl) lbl.textContent = timeStr;
        });
      }, 1000);

      // 每30秒更新位置
      const posInterval = setInterval(updateNowLine, 30000);

      // 保存清理函数
      tl._cleanup = function() {
        clearInterval(timeInterval);
        clearInterval(posInterval);
        document.removeEventListener('click', onDocClick);
      };
    }

    const dateDisplay = document.getElementById('dateDisplay');
    dateDisplay.textContent = formatDate(new Date());

    const btn = document.getElementById('seasonBtn');
    const seasonLabel = document.getElementById('seasonLabel');
    
    btn.textContent = isWinter ? '冬' : '夏';
    if (isWinter) btn.classList.add('winter');
    seasonLabel.textContent = '令时';
    
    btn.addEventListener('click', () => {
      isWinter = !isWinter;
      btn.textContent = isWinter ? '冬' : '夏';
      btn.classList.toggle('winter', isWinter);
      // 清理旧的定时器
      const oldTl = document.getElementById('timeline');
      if (oldTl._cleanup) oldTl._cleanup();
      render(isWinter ? 'winter' : 'summer');
    });

    render(isWinter ? 'winter' : 'summer');

    // 窗口尺寸变化时重新渲染（节流 200ms）
    // 只响应宽度变化，忽略高度变化（手机地址栏收起导致的 resize）
    let resizeTimer;
    let lastInnerWidth = window.innerWidth;
    window.addEventListener('resize', () => {
      const newWidth = window.innerWidth;
      if (newWidth === lastInnerWidth) return; // 只有高度变化，跳过
      lastInnerWidth = newWidth;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        // 记住当前滚动位置，重渲染后恢复
        const wrapperEl = document.querySelector('.timeline-wrapper');
        const savedScroll = wrapperEl ? wrapperEl.scrollLeft : 0;
        const oldTl = document.getElementById('timeline');
        if (oldTl._cleanup) oldTl._cleanup();
        render(isWinter ? 'winter' : 'summer');
        // 恢复滚动位置，覆盖 render 内的初始滚动
        if (wrapperEl) setTimeout(() => { wrapperEl.scrollLeft = savedScroll; }, 90);
      }, 200);
    });
  })();
</script>
</body>
</html>
